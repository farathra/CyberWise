<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CyberWise - Learn Smart. Stay Secure. Digital Security Learning Platform." />
  <meta name="theme-color" content="#101820" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <title>CyberWise — Learn Smart. Stay Secure.</title>
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <div id="app">
    <header id="site-header">
      <div class="header-inner header-container">
        <a href="#/learn" class="logo brand-link" aria-label="CyberWise Home">
          <svg class="logo-icon brand-logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M20 3L5 10v10c0 9.5 6.5 18.4 15 20.9C29.5 38.4 36 29.5 36 20V10L20 3z" fill="var(--color-primary)" opacity="0.15" stroke="var(--color-primary)" stroke-width="2"/>
            <path d="M15 20l4 4 7-8" stroke="var(--color-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="logo-text brand-info">
            <span class="logo-name brand-title">CyberWise</span>
            <span class="logo-slogan brand-slogan">Learn Smart. Stay Secure.</span>
          </div>
        </a>
        <div class="header-actions">
          <button id="global-search-btn" class="search-trigger-btn" aria-label="Search lessons, quizzes, or notes" title="Search (Press / or Ctrl+K)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span class="search-trigger-label">Search...</span>
            <kbd class="search-kbd-shortcut">/</kbd>
          </button>
          <div class="lang-selector" id="lang-selector" role="group" aria-label="Language selector">
            <button type="button" class="lang-btn active" data-lang="en" aria-label="Switch language to English" title="English">EN</button>
            <span class="lang-divider" aria-hidden="true">|</span>
            <button type="button" class="lang-btn" data-lang="id" aria-label="Ganti bahasa ke Indonesia" title="Bahasa Indonesia">ID</button>
          </div>
          <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark mode" title="Toggle dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <nav id="tab-nav" role="navigation" aria-label="Main navigation">
      <div class="tab-nav-inner tab-nav-container">
        <a href="#/learn" class="tab-link nav-item" data-tab="learn">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Learn
        </a>
        <a href="#/quiz" class="tab-link nav-item" data-tab="quiz">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Quiz
        </a>
        <a href="#/notes" class="tab-link nav-item" data-tab="notes">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Notes
        </a>
        <a href="#/glossary" class="tab-link nav-item" data-tab="glossary">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Glossary
        </a>
        <a href="#/games" class="tab-link nav-item" data-tab="games">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 12h4m-2-2v4"/><circle cx="17" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="13" r="1" fill="currentColor"/></svg>
          Games
        </a>
        <a href="#/analytics" class="tab-link nav-item" data-tab="analytics">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Analytics
        </a>
      </div>
    </nav>

    <main id="main-content" role="main">
      <div id="page-container"></div>
    </main>

    <footer id="site-footer">
      <div class="footer-inner">
        <p>Made by <strong>Fardhan Athallah Raditya</strong></p>
      </div>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
